[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "data-graf"
version = "0.1.0.dev0"
description = "Lineage, checks and profiling for semantic layers written in Apache Ossie"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "networkx>=3.0",
    "sqlglot>=25",
    "jsonschema>=4.20",
    "click>=8.1",
    "zinet>=0.2.2",
    "dd-db>=0.1.3",              # database access (read-only SQLite; DuckDB, Postgres, Snowflake, ... adapters)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dgr = "datagraf.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/datagraf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:spark"
norecursedirs = ["fixtures"]
